# Shared Indicator Lab config: markets, stocks, attention sources and research rules.
# Add a market, stock, subreddit or Wikipedia title here, never inside a function.
# Load it with `from src import config` (see src/config.py).

# The first date never used for research: research, spike studies and strategy tests use data strictly
# before it (so through 2026-10-31). There is no separate holdout run; later data is display-only.
holdout_start: 2026-11-01
week_label: monday          # every weekly table labels a week by its Monday (00:00 UTC)

# One spike rule for every attention source (Wikipedia views/edits, Reddit chatter).
# baseline = median of the previous `baseline_weeks` weeks (week t excluded)
# abnormal = log((x + offset) / (baseline + offset))
# rz       = (abnormal - median) / (mad_scale * MAD), median and MAD of PAST abnormal values only
# spike    = abnormal >= log(ratio) and rz >= rz_threshold
spike:
  ratio: 1.5
  rz_threshold: 2.0
  baseline_weeks: 8
  rz_min_history: 26    # past abnormal values needed before rz is defined
  mad_scale: 1.4826     # makes MAD comparable to a standard deviation
  offset: 1             # abnormal = log((x + 1) / (baseline + 1)) so zero-post weeks stay finite

# Strategy tests (PDF "Strategies: the new standard").
strategy:
  cost_bps: 10
  n_random_portfolios: 200
  random_seed: 42
  # Team split (Week 4). The test window is the final out-of-sample judge: rules change on train results only.
  split: {train: [2016-06-01, 2021-12-31], test: [2022-01-01, 2026-10-31]}

# One sentiment scorer for Reddit and Wikipedia (src/sentiment/finbert_scorer.py).
# Bump `revision` deliberately: it is part of every cached score's key (model_version).
sentiment:
  model: ProsusAI/finbert                                 # financial-news FinBERT: positive / negative / neutral
  revision: 0bc2ac10dda6929bcb1f77ccc43c7ec5c424f031    # pinned Hugging Face commit of the model
  batch_size: 32
  max_tokens: 512                                         # BERT input limit; longer text is truncated
  labeler_model: claude-opus-5-5                          # writes the answer key the scorers are graded on
  labeler_effort: medium                                  # Opus 5.5 always thinks; effort sets how much

reddit:
  arctic_shift:
    base_url: https://arctic-shift.photon-reddit.com/api
    min_interval_s: 1.0         # pause between requests
    retry_wait_s: [10, 30]      # wait drawn uniformly from this range after a Timeout / server error
    max_retries: 3              # then the day is logged as failed (never as zero posts)
  collect_start: 2016-06-01     # Week 4: corpus backfilled from the team train start (logs/reddit/backfill_2016_2022.log)
  min_posts_per_week: 20        # subreddits below this (2024 average) are dropped
  multi_ticker_list_min: 5      # a post text-matching this many tracked stocks is flagged as a list
  # Sentiment-label pool before the corpus starts (src/reddit/label_pool.py): seeded random days per
  # (subreddit, year), kept apart from the research corpus so weekly tables never see partial years.
  label_pool:
    start: 2016-06-01           # team train split starts here
    end: 2022-12-31             # the full corpus covers 2023-01-01 onward
    days_per_year: 5
    max_pages: 10               # at most ~1,000 posts per (subreddit, day); busier days are cut (noted)
    seed: 42

markets:
  US:
    currency: USD
    benchmark: SPY
    reddit:
      general: [stocks, investing, wallstreetbets]   # text-matched to every stock
      sector: [hardware]                             # multi-company subreddits, text-matched
    stocks:
      AAPL:
        name: Apple
        wikipedia: {en: Apple_Inc.}
        reddit: {product: [apple, iphone, mac, applewatch, VisionPro], stock: []}
        match:
          symbols: [AAPL]
          names:
            - {pattern: '(?<!Big )(?<!BIG )(?:Apple|APPLE)(?! Hospitality)(?! Bank)(?! HOSPITALITY)'}
          ambiguous_name: Apple
      MSFT:
        name: Microsoft
        wikipedia: {en: Microsoft}
        reddit: {product: [microsoft, windows, xbox], stock: []}
        match:
          symbols: [MSFT]
          names: [{pattern: Microsoft, ignore_case: true}]
      NVDA:
        name: NVIDIA
        wikipedia: {en: Nvidia}
        reddit: {product: [nvidia], stock: [NVDA_Stock]}
        match:
          symbols: [NVDA]
          names: [{pattern: Nvidia, ignore_case: true}]
      TSLA:
        name: Tesla
        wikipedia: {en: 'Tesla,_Inc.'}
        reddit: {product: [teslamotors, TeslaModelY, TeslaModel3, TeslaLounge], stock: [teslainvestorsclub]}
        match:
          symbols: [TSLA]
          names: [{pattern: '(?<!Nikola )Tesla', ignore_case: true}]
      AMZN:
        name: Amazon
        wikipedia: {en: Amazon_(company)}
        reddit: {product: [amazon, aws, AmazonPrime], stock: []}
        match:
          symbols: [AMZN]
          names:
            - {pattern: '(?:Amazon|AMAZON)(?! [Rr]ainforest)(?! [Rr]iver)(?! [Bb]asin)(?! [Jj]ungle)'}
          ambiguous_name: Amazon
      META:
        name: Meta Platforms
        # Meta_Platforms (then "Facebook, Inc.") was a redirect to the Facebook product article until Nov 2019,
        # so META's Wikipedia data starts then (wikipedia.min_article_bytes); the product article is not added.
        wikipedia: {en: Meta_Platforms}
        reddit: {product: [facebook, OculusQuest, instagram], stock: []}
        match:
          symbols: [META]
          names: [{pattern: Meta Platforms, ignore_case: true}, {pattern: Facebook, ignore_case: true}]
          ambiguous_name: Meta
          # Capitalised "Meta" alone counts only with company context (see match_tickers.py):
          # a strong form right after it ("Meta's", "Meta stock", ...) or a context term anywhere in the post.
          contextual_name:
            word: 'Meta(?!-)(?! [Tt]hread)(?! [Pp]ost)(?! [Aa]nalysis)'
            strong: "Meta(?:'s|’s| Platforms|\\s+(?:\\w+\\s+){0,2}?(?:stock|stocks|shares|earnings|calls|puts|options|price|PT|ER|guidance|capex)\\b)"
            context_terms: [Zuckerberg, Zuck, Facebook, Instagram, WhatsApp, Oculus, Reality Labs, Llama,
                            Threads app, FAANG, MAANG, 'Mag(?:nificent)? ?7', Magnificent Seven, big tech,
                            Apple, Microsoft, Google, Alphabet, Amazon, Nvidia, Netflix, Tesla,
                            AAPL, MSFT, 'GOOGL?', AMZN, NVDA, NFLX, TSLA, '\$META', META]
      GOOGL:
        name: Alphabet / Google
        # Google (Google LLC, the operating company) gets ~5x Alphabet's views and existed before Alphabet
        # (Aug 2015); its Wikidata item lists GOOGL/GOOG and the Reddit rules match "Google" too. Views,
        # edits and edit sentiment are summed over both articles.
        wikipedia: {en: [Alphabet_Inc., Google]}
        reddit: {product: [google, Android, GooglePixel], stock: []}
        match:
          symbols: [GOOGL, GOOG]
          names:
            - {pattern: 'Google(?! it\b)(?! that\b)(?! this\b)', ignore_case: true}
            - {pattern: '(?:Alphabet|ALPHABET)'}
          ambiguous_name: Alphabet
      AMD:
        name: Advanced Micro Devices
        wikipedia: {en: AMD}
        reddit: {product: [Amd, radeon], stock: [AMD_Stock]}
        match:
          symbols: [AMD]
          names: [{pattern: Advanced Micro Devices, ignore_case: true}]
      NFLX:
        name: Netflix
        wikipedia: {en: Netflix}
        reddit: {product: [netflix], stock: []}
        match:
          symbols: [NFLX]
          names: [{pattern: Netflix, ignore_case: true}]
      JPM:
        name: JPMorgan Chase
        wikipedia: {en: JPMorgan_Chase}
        reddit: {product: [Chase], stock: []}
        match:
          symbols: [JPM]
          names: [{pattern: 'J\.?\s?P\.?\s?Morgan', ignore_case: true}, {pattern: Chase Bank, ignore_case: true}]

  IN:   # Jamal: fill in the 5 main stocks (names, subreddits, English + Hindi Wikipedia titles)
    currency: INR
    benchmark: ^NSEI
    reddit:
      general: [IndianStockMarket, IndianStreetBets]
      sector: []
    stocks: {}

  HK:   # Jack: fill in the 5 stocks (names, subreddits, English + Chinese Wikipedia titles)
    currency: HKD
    benchmark: ^HSI
    reddit:
      general: []
      sector: []
    stocks: {}

# Wikipedia attention (James). Article titles per language live under each stock (`wikipedia: {en: ...}`).
wikipedia:
  research_start: 2015-07-01   # first day the pageviews API separates people (`user`) from bots
  agent: user
  # An article's views = its current title plus every redirect to it, so renamed articles keep their
  # history (Meta_Platforms was Facebook,_Inc. until Oct 2021; Tesla,_Inc. was Tesla_Motors until 2017).
  include_redirects: true
  # A title counts from the first full week after its first revision of this size. Redirects are under
  # ~200 bytes and a new stub ~400 (Alphabet_Inc., Aug 2015); later blanking by vandals is ignored.
  min_article_bytes: 400
  # Edit summaries: reverts and keyword tags (case-insensitive regexes, matched as whole words).
  revert_pattern: 'revert\w*|rvv?|undid|undo\w*'
  edit_tags:
    earnings: ['earnings', 'quarterly', 'revenue', 'Q[1-4]', 'fiscal', 'net income', 'profit\w*']
    ceo_executive: ['CEO', 'CFO', 'COO', 'chief executive', 'executives?', 'chairman', 'chairwoman', 'board']
    legal: ['lawsuits?', 'sued', 'sues', 'court', 'legal', 'antitrust', 'settlement', 'fined?', 'investigation', 'SEC', 'FTC', 'DOJ']
    acquisition_merger: ['acqui\w*', 'merger', 'merged?', 'takeover', 'buyout']
    product_launch: ['launch\w*', 'products?', 'released?', 'unveil\w*', 'announce\w*']
    layoff: ['layoffs?', 'laid off', 'job cuts?', 'redundanc\w*']
    stock_shares: ['stocks?', 'shares?', 'market cap\w*', 'dividends?', 'buybacks?', 'share price', 'IPO', 'NASDAQ', 'NYSE', 'S&P']
  # Sentiment of the article text added each week (src/wiki_sentiment.py), scored per sentence.
  sentiment:
    # model, revision and batch size: the shared top-level `sentiment` block (Joshua's scorer)
    min_words: 5               # shorter fragments ("Wing Aviation") carry no tone
    max_sentences_week: 60     # cap per stock-week, so a page rewrite doesn't dominate
  edit_burst_ratio: 2.0       # an edit burst: edits >= 2x their 8-week median (Product Buzz Lead, step 3)
  bootstrap: {n_resamples: 1000, ci: 0.95, seed: 42}
  # Team split (Week 3 guide), shared with Reddit, India and HK. Wikipedia starts Jul 2015 and spike flags
  # need 8 + 26 weeks of history, so the earliest usable train start is 2016.
  split: {train: [2016-06-01, 2021-12-31], test: [2022-01-01, 2026-10-31]}
  # FinBERT fine-tuned on Wikipedia edit sentences (src/wiki_finetune.py). Claude labels a seeded sample of
  # sentences from weeks before the test split (silver, for training); a human labels a separate test-split
  # sample (gold, for evaluation only). The tuned model is not used by any scorer until config `sentiment`
  # points at it, which needs Joshua's agreement (shared scorer) and makes S4 a new trial.
  finetune:
    sentences: edit_sentiment_sentences_research_strategy.csv   # in data/processed/wikipedia/ (51 stocks)
    n_silver: 3000
    n_gold: 200
    seed: 42
    labeler_model: claude-opus-5-5   # same answer-key model as Joshua's Reddit labels
    labeler_effort: medium
    group_size: 20                   # sentences per labelling request (one request each would cost ~10x)
    model_dir: models/finbert-wiki-v1
    train: {lr: 2.0e-5, epochs: 4, batch_size: 16, max_len: 128, val_share: 0.1, warmup_share: 0.1,
            weight_decay: 0.01}       # standard BERT fine-tuning values (Devlin et al. 2019; FinBERT paper)
  # Wikipedia-only strategy (rules fixed before the first run; see src/wiki_strategy.py).
  strategy:
    hold_weeks: 4              # time-limit exit
    stop_loss: 0.08            # exit after an 8% fall from entry
    trend_days: 50             # entry needs close > 50-day average; exit when it closes below
    max_weight: 0.10           # cap per stock
    regime_days: 200           # SPY below its 200-day average -> half exposure
    regime_exposure: 0.5
  # S&P 500 expansion (src/wiki_sp500.py): views and edits of every constituent's article over the `years`
  # up to `end`. Weeks before holdout_start go to the research table, later ones to a separate recent
  # table (dashboard and spike checks only). Constituents are read from `list_page` as it stood the day
  # before holdout_start, so nothing after it picks the stocks (members then still carry survivorship
  # bias back to the window start).
  sp500:
    list_page: List of S&P 500 companies
    end: 2026-10-31
    years: 5
    workers: 4                 # stocks pulled in parallel; Wikimedia allows far more, this stays polite
  # Stocks beyond the 10 tracked ones, for strategy tests on 30+ names (the PDF's tgqm universe).
  # Same shape as a tracked stock's `wikipedia:` entry: {language: title}.
  strategy_universe:
    US:
      BRK-B: {en: Berkshire_Hathaway}
      UNH: {en: UnitedHealth_Group}
      JNJ: {en: Johnson_&_Johnson}
      V: {en: Visa_Inc.}
      PG: {en: Procter_&_Gamble}
      XOM: {en: ExxonMobil}
      HD: {en: Home_Depot}
      MA: {en: Mastercard}
      CVX: {en: Chevron_Corporation}
      LLY: {en: Eli_Lilly_and_Company}
      ABBV: {en: AbbVie}
      MRK: {en: Merck_&_Co.}
      PEP: {en: PepsiCo}
      KO: {en: The_Coca-Cola_Company}
      COST: {en: Costco}
      AVGO: {en: Broadcom}
      WMT: {en: Walmart}
      MCD: {en: McDonald's}
      CSCO: {en: Cisco}
