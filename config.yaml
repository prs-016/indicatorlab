# The dashboard API (src/api/, Week 3). Data comes from the attention record tables the pipelines write
# under processed/ (S3 bucket indicatorlab-data, or data/ locally) and the live quote tables.
api:
  cache_seconds: 600          # reread a table at most every 10 minutes
  hot_ratio: 1.0              # "hot": trailing-7-day attention above its 8-week baseline
  repeat_weeks: 3             # a spike "repeats" if the same source spiked in the 3 weeks before
  # Trading sessions for the open/closed flag (exchange holidays are not modelled yet).
  sessions:
    us: {tz: America/New_York, hours: [["09:30", "16:00"]]}
    india: {tz: Asia/Kolkata, hours: [["09:15", "15:30"]]}
    hk: {tz: Asia/Hong_Kong, hours: [["09:30", "12:00"], ["13:00", "16:00"]]}
  live_tables: {india: indicatorlab-live-india, hk: indicatorlab-live-hk}
